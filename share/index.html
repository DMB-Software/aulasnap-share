<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#6750e8">
    <title>Conteúdo compartilhado — AulaSnap</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            color: #1c1924;
            background: #f8f6ff;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 480px);
            padding: 40px;
            border: 1px solid #e3def2;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 22px 60px rgba(48, 34, 97, .12);
            text-align: center;
        }
        img { width: 76px; height: 76px; margin-bottom: 18px; }
        h1 { margin: 0 0 12px; font-size: 1.8rem; line-height: 1.2; letter-spacing: -.035em; }
        p { margin: 0; color: #625c6d; line-height: 1.65; }
        p + p { margin-top: 8px; }
        a { display: inline-block; margin-top: 24px; color: #4f3ac7; font-weight: 700; text-underline-offset: 3px; }
        a:focus-visible { outline: 3px solid #9d8dff; outline-offset: 4px; border-radius: 4px; }
        @media (max-width: 480px) { main { padding: 30px 24px; } }
    </style>
</head>
<body>
    <main>
        <img src="../s.%20titulo/SVG/Prancheta%201.svg" alt="" width="76" height="76">
        <h1>Conteúdo compartilhado pelo AulaSnap</h1>
        <p>Abra este link em um aparelho com o AulaSnap instalado.</p>
        <p>Se o aplicativo não abrir automaticamente, tente acessar o link novamente pelo seu celular.</p>
        <a href="../">Conhecer o AulaSnap</a>
    </main>
</body>
</html>
